name: Java Maven CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Test and Package
    runs-on: self-hosted

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Build
      - name: Build Java Project
        run: mvn clean compile

      # 4. Test
      - name: Run Unit Tests
        run: mvn test

      # 5. Package
      - name: Package Application
        run: mvn package -DskipTests

      # 6. Upload artifact
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-maven-artifact
          path: target/*.jar
